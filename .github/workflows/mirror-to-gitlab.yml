name: Mirror a GitLab / Mirror to GitLab

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Push GitHub -> GitLab
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message || '', '[skip mirror]')"
    steps:
      - name: Mirror clone and push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITLAB_REPO: https://gitlab.com/BENDER_5000/sc_soft_ed.git
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::error::Falta el secreto GITLAB_TOKEN"; exit 1
          fi
          # Clon espejo: contiene todas las ramas y etiquetas sin tocar un working tree.
          git clone --quiet --mirror "https://github.com/${GITHUB_REPOSITORY}.git" mirror.git
          cd mirror.git

          remote_url="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO#https://}"
          local_head="$(git rev-parse "refs/heads/${BRANCH_NAME}")"
          remote_head="$(git ls-remote "$remote_url" "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          if [ "$local_head" = "$remote_head" ]; then
            echo "GitLab ya contiene ${local_head}; no hay nada que replicar."
            exit 0
          fi

          git push --force "$remote_url" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          echo "Espejo GitHub -> GitLab completado (${BRANCH_NAME} @ ${local_head})."
